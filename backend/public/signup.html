<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Monastery360</title>
  <link rel="stylesheet" href="./style/signup.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body style="background-image: url('background.png');">
  <div class="auth-container">
    <img src="logo.png" alt="Monastery360 Logo" class="logo">
    <h2>Create an Account</h2>
    <p class="subtitle">Join to explore Sikkim's Digital Heritage.</p>

    <form id="signupForm">
      <input type="text" id="fullname" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      
      <select id="role" required>
          <option value="" disabled selected>Select Your Role</option>
          <option value="tourist">Tourist</option>
          <option value="researcher">Researcher</option>
      </select>

      <button type="submit" class="submit-btn">Create Account</button>
    </form>

    <div class="footer-links">
      <span>Already have an account? <a href="index.html">Log in</a></span>
    </div>
  </div>

  <script src="./js/signup.js"></script>
</body>
</html>
